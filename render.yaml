databases:
  - name: entryrecorder-db
    plan: free
    databaseName: entryrecorder
    user: entryrecorder

services:
  - type: web
    name: entryrecorder
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn entryrecorder.wsgi:application"
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: entryrecorder-db
          property: connectionString
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
